name: Workbench verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: product-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - name: python-tests
        run: python3 -m unittest discover -s tests -v
  verify:
    name: verify
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Reject missing, skipped, cancelled or failed verification
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
